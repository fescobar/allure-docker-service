{{- if and .Values.api.enabled (not .Values.api.security.existingSecret) -}}
{{/*
  Stable-random Secret for API credentials.

  Lookup strategy (preserves values across helm upgrade):
    1. If the user set a value in api.security.*, use it.
    2. Else if the Secret already exists in the cluster, keep the stored value.
    3. Else generate a random 16-character alphanumeric string.

  Note: `helm template` always skips the lookup (no cluster connection), so
  rendered output will show freshly generated randoms — this is expected and
  harmless because `helm install/upgrade` will use the stable lookup path.
*/}}
{{- $existingData := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace (include "allure-docker-service.api.fullname" .) -}}
{{- $existingData = .data | default dict -}}
{{- end -}}

{{- $user := "" -}}
{{- if .Values.api.security.user -}}
{{- $user = .Values.api.security.user -}}
{{- else if hasKey $existingData "user" -}}
{{- $user = index $existingData "user" | b64dec -}}
{{- else -}}
{{- $user = randAlphaNum 16 -}}
{{- end -}}

{{- $password := "" -}}
{{- if .Values.api.security.password -}}
{{- $password = .Values.api.security.password -}}
{{- else if hasKey $existingData "password" -}}
{{- $password = index $existingData "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 16 -}}
{{- end -}}

{{- $viewerUser := "" -}}
{{- if .Values.api.security.viewerUser -}}
{{- $viewerUser = .Values.api.security.viewerUser -}}
{{- else if hasKey $existingData "viewerUser" -}}
{{- $viewerUser = index $existingData "viewerUser" | b64dec -}}
{{- else -}}
{{- $viewerUser = randAlphaNum 16 -}}
{{- end -}}

{{- $viewerPassword := "" -}}
{{- if .Values.api.security.viewerPassword -}}
{{- $viewerPassword = .Values.api.security.viewerPassword -}}
{{- else if hasKey $existingData "viewerPassword" -}}
{{- $viewerPassword = index $existingData "viewerPassword" | b64dec -}}
{{- else -}}
{{- $viewerPassword = randAlphaNum 16 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "allure-docker-service.api.fullname" . }}
  labels:
    {{- include "allure-docker-service.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  user: {{ $user | quote }}
  password: {{ $password | quote }}
  viewerUser: {{ $viewerUser | quote }}
  viewerPassword: {{ $viewerPassword | quote }}
{{- end }}
