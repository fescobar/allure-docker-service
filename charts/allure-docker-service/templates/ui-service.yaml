{{- if .Values.ui.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "allure-docker-service.ui.fullname" . }}
  labels:
    {{- include "allure-docker-service.ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "allure-docker-service.ui.selectorLabels" . | nindent 4 }}
{{- end }}
