name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install the Allure CLI
        run: |
          version=$(sed -n 's/^ARG ALLURE_VERSION=//p' docker/Dockerfile)
          test -n "$version"
          npm i -g "allure@$version"

      - name: Assert the report toolchain is present
        run: |
          for bin in node allure google-chrome-stable; do
            command -v "$bin" || { echo "missing: $bin"; exit 1; }
          done

      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ci:${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 5050:5050 -e PUBLIC_BASE_URL=http://localhost:5050 ci:${{ github.sha }}
          for _ in $(seq 30); do
            curl -fsS http://localhost:5050/health && ok=1 && break
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          test -n "$ok"
